name: CI Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper JAR and checksum
        uses: gradle/actions/wrapper-validation@v5

  build-test:
    name: Build, Unit/Robolectric Tests & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Robolectric android-all jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-16-13921718-i7
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Pre-fetch Robolectric android-all jar
        shell: bash
        run: |
          set -euo pipefail
          ROBO_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          ROBO_JAR="$ROBO_DIR/android-all-instrumented-16-robolectric-13921718-i7.jar"
          if [ ! -f "$ROBO_JAR" ] || [ ! -s "$ROBO_JAR" ]; then
            echo "Pre-fetching Robolectric Android 16 shadow jar..."
            mkdir -p "$ROBO_DIR"
            curl -fSL --retry 5 --retry-connrefused --retry-delay 3 \
              "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/android-all-instrumented-16-robolectric-13921718-i7.jar" \
              -o "$ROBO_JAR"
          fi
          ls -lh "$ROBO_JAR"

      - name: Prepare debug keystore for debug APK verification
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug, Compile Release Kotlin, Run Tests & Lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:compileReleaseKotlin :app:testDebugUnitTest :app:lintDebug \
            --no-daemon \
            --stacktrace

      - name: Clean up ephemeral debug keystore
        if: always()
        shell: bash
        run: rm -f debug.keystore

      - name: Upload Test, Lint & Reviewer Debug APK Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: warn

  security-static:
    name: Static Security & Workflow Policy Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify workflow permissions, release hygiene & secret-free PR CI
        shell: bash
        run: |
          set -euo pipefail

          # 1. Legacy push-to-release workflow must stay deleted
          if [ -e ".github/workflows/release_on_push.yml" ]; then
            echo "::error::Legacy .github/workflows/release_on_push.yml must not exist."
            exit 1
          fi

          # 2. Release workflow must never fall back to debug signing
          if grep -Eq 'DEBUG_KEYSTORE_BASE64|assembleDebug|debug\.keystore' .github/workflows/release.yml; then
            echo "::error::.github/workflows/release.yml contains prohibited debug-signing references."
            exit 1
          fi

          # 3. PR CI workflow must not use unsafe trigger or repository secrets
          if grep -Eq '^[[:space:]]*[p]ull_request_target[[:space:]]*:|\$\{\{[[:space:]]*[s]ecrets\.' .github/workflows/ci.yml; then
            echo "::error::ci.yml must not use unsafe PR target triggers or repository secrets."
            exit 1
          fi

          # 4. Guard against accidentally committed private keys in app source
          if grep -rnE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' app/src; then
            echo "::error::Private key material detected in app/src."
            exit 1
          fi

          # 5. ADR-003 (T-04.1.2): firebase-ai cloud AI SDK must stay removed from build & source
          if grep -rnE 'firebase[-.]ai|com\.google\.firebase\.ai' app/build.gradle.kts gradle/libs.versions.toml app/src/main; then
            echo "::error::Prohibited cloud AI dependency or import (firebase-ai) detected."
            exit 1
          fi

          # 6. ADR-011 (T-04.1.1): YouTube Intelligence and creator branding must stay removed from app/src/main
          if grep -rniE 'vinh|giang|askvinh|YouTubeIntelligenceClient|YouTubeIntelligenceScreen' app/src/main; then
            echo "::error::Prohibited creator branding or YouTube Intelligence symbol detected in app/src/main."
            exit 1
          fi

          # 7. ADR-004 (T-04.1.3): In-app APK updater, install intents, GitHub Releases API calls, publish script, and release collections must stay removed
          if [ -e "scripts/publish_firestore_release.mjs" ]; then
            echo "::error::Retired scripts/publish_firestore_release.mjs must not exist."
            exit 1
          fi
          if grep -rnE 'REQUEST_INSTALL_PACKAGES|ACTION_INSTALL_PACKAGE|vnd\.android\.package-archive|api\.github\.com/repos|GitHubReleaseClient|ReleaseUpdateRepository|UpdateBackupManager|AppUpdateScreen|UpdateAvailableDialog|applicationReleases|applicationUpdateEvents' app/src/main firestore.rules; then
            echo "::error::Prohibited in-app updater, install-intent, GitHub Releases API, or retired release collection reference detected."
            exit 1
          fi

          # 8. ADR-007 / SEC-REQ-34 (T-04.2.3): All logging must route through AppLogger with PII redaction; no raw android.util.Log or println in app/src/main
          if grep -rnE 'android\.util\.Log' --exclude="AppLogger.kt" app/src/main/java; then
            echo "::error::Direct android.util.Log reference detected outside AppLogger.kt. All logging must route through AppLogger."
            exit 1
          fi
          if grep -rnE 'println\(' --exclude="AppLogger.kt" app/src/main/java; then
            echo "::error::println calls detected in app/src/main/java. Use AppLogger instead."
            exit 1
          fi

          echo "All static security and workflow hygiene checks passed."
